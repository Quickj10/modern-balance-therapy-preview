<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Manrope:wght@500;600&display=block">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
.c{position:relative;width:1200px;height:630px;overflow:hidden;
 background:
  radial-gradient(60% 80% at 8% 12%, #C9D3C2 0%, transparent 62%),
  radial-gradient(55% 75% at 42% 100%, #BFC9D8 0%, transparent 65%),
  radial-gradient(60% 85% at 100% 30%, #DCC6D1 0%, transparent 60%),
  linear-gradient(115deg,#D3DACB 0%,#CDD5E0 42%,#E2D2DA 76%,#F4EFE5 100%);}
.grain{position:absolute;inset:0;opacity:.5;mix-blend-mode:multiply}
.inner{position:absolute;inset:0;display:flex;align-items:center;gap:72px;padding:0 96px}
.mark{flex:none;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 30px 60px -30px rgba(46,38,48,.35),inset 0 1px 0 rgba(255,255,255,.8);display:grid;place-items:center}
.mark svg{width:210px;height:210px;overflow:visible}
.txt{color:#2E2630}
.k{font-family:Manrope;font-weight:600;font-size:20px;letter-spacing:.22em;text-transform:uppercase;color:#4F5A42;margin:0 0 22px}
h1{font-family:"EB Garamond";font-weight:400;font-size:86px;line-height:1.0;margin:0;color:#433340;letter-spacing:-.01em}
h1 span{display:block;font-size:40px;letter-spacing:.32em;text-transform:uppercase;font-family:Manrope;font-weight:500;color:#433340;margin-top:16px}
.t{font-family:"EB Garamond";font-style:italic;font-size:42px;color:#74526A;margin:34px 0 0}
.rule{width:84px;height:2px;background:#B592A4;margin:30px 0 0;border-radius:2px}
</style></head><body><div class="c">
<svg class="grain" width="1200" height="630"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="7"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .32  0 0 0 0 .3  0 0 0 .22 0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="inner">
 <div class="mark"><svg viewBox="0 0 34 34"><defs><filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy=".6" stdDeviation=".5" flood-color="#2E2630" flood-opacity=".22"/></filter></defs>
  <g filter="url(#s)"><ellipse cx="17" cy="28.5" rx="13" ry="4.5" fill="#7E8B6A"/><ellipse cx="16" cy="19.5" rx="9.5" ry="4" fill="#B8C4B0"/><ellipse cx="17.5" cy="11.5" rx="6" ry="3.4" fill="#B592A4"/></g></svg></div>
 <div class="txt">
  <p class="k">Online therapy across Texas</p>
  <h1>Modern Balance<span>Therapy</span></h1>
  <div class="rule"></div>
  <p class="t">Finding balance in a modern world.</p>
 </div>
</div></div></body></html>
